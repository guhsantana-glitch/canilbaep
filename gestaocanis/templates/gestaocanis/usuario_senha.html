{% extends "base.html" %}
{% block content %}
<div class="barra-acoes" style="margin-top:0;margin-bottom:0.6rem;">
  <a href="{% url 'gestao_usuarios' %}" class="btn btn-secundario">← Voltar</a>
</div>
<span class="eyebrow">Gestão geral</span>
<h1>Redefinir senha: {{ vinculo.usuario.username }}</h1>
<div class="card">
  <p>Canil: <b>{{ vinculo.canil.nome }}</b></p>
  <p style="color:#666;font-size:0.88rem;">Será gerada uma senha aleatória. O usuário terá que trocá-la no próximo acesso.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn" type="submit">Gerar nova senha</button>
    <a href="{% url 'gestao_usuarios' %}" class="btn btn-secundario">Cancelar</a>
  </form>
</div>
{% endblock %}
