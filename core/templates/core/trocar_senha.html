{% extends "base.html" %}
{% block title %}Definir senha — Canil 10° BAEP{% endblock %}
{% block content %}
<div style="max-width:440px;margin:2.5rem auto;" class="card">
  <span class="eyebrow">Primeiro acesso</span>
  <h1>Defina sua senha</h1>
  <p style="color:#666;font-size:0.88rem;">Por segurança, você precisa trocar a senha inicial antes de usar o sistema.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-linha">
      <label>Nova senha</label>
      <input type="password" name="nova_senha" required>
    </div>
    <div class="form-linha">
      <label>Confirmar nova senha</label>
      <input type="password" name="confirmar_senha" required>
    </div>
    <button class="btn" type="submit" style="width:100%;">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
