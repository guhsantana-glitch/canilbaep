{% extends "base.html" %}
{% block content %}
<div style="max-width:380px;margin:3rem auto;" class="card">
  <span class="eyebrow">Acesso restrito</span>
  <h1>Entrar no sistema</h1>
  <p style="color:#666;font-size:0.88rem;margin-top:-0.4rem;">Use suas credenciais cadastradas pela administração do canil.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-linha">
      <label>Usuário</label>
      {{ form.username }}
    </div>
    <div class="form-linha">
      <label>Senha</label>
      {{ form.password }}
    </div>
    {% if form.errors %}<p style="color:#8a3324;font-size:0.85rem;">Usuário ou senha inválidos.</p>{% endif %}
    <button class="btn" type="submit" style="width:100%;">Entrar</button>
  </form>
</div>
{% endblock %}
